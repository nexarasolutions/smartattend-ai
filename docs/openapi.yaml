openapi: 3.1.0
info:
  title: SmartAttend AI API
  version: 1.0.0
  description: >-
    Manus-hosted Flask API for the SmartAttend college attendance workspace. The
    server uses the Manus-managed MySQL-compatible application database. User
    roles and assignment scopes are enforced on the server. Device APIs require
    HTTPS and per-device credentials. Successful JSON responses use a data
    envelope; errors include a stable code and request_id.
servers:
  - url: /
    description: Same-origin Manus Preview or published SmartAttend site
security: []
tags:
  - name: System
  - name: Authentication
  - name: Admin
  - name: Students
  - name: Staff
  - name: Subjects
  - name: Attendance
  - name: Devices
  - name: Predictions
  - name: Notifications
  - name: Reports
paths:
  /_app/health:
    get:
      tags: [System]
      operationId: liveness
      summary: Application liveness
      responses:
        '200': { description: Application is responding, content: { application/json: { schema: { $ref: '#/components/schemas/LivenessResponse' } } } }
  /api/health/ready:
    get:
      tags: [System]
      operationId: readiness
      summary: Database readiness
      description: Executes a read-only `SELECT 1`; returns the standard success/error envelope and request ID.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '503': { $ref: '#/components/responses/Error' }
  /api/system/status:
    get:
      tags: [System]
      operationId: systemStatus
      summary: Non-secret service configuration status
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/auth/start:
    post:
      tags: [Authentication]
      operationId: startManusLogin
      summary: Start Manus OAuth
      description: The submitted `origin` is matched to the browser Origin, verified Referer, or—only when both are absent/opaque—browser-provided same-origin Fetch Metadata. Returns a provider authorization URL and sets a short-lived nonce cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthStartRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/auth/manus/callback:
    get:
      tags: [Authentication]
      operationId: manusOAuthCallback
      summary: Complete Manus OAuth
      description: Exchanges the code server-side, persists a pending user when needed and redirects to the same site.
      parameters:
        - { in: query, name: code, required: true, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
      responses:
        '303': { description: Redirect to SmartAttend with a Secure session cookie on HTTPS. }
        '400': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Issue a double-submit CSRF token
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      summary: Resolve current Manus identity and database role
      security: [{ appSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Clear the application session
      security: [{ appSession: [], csrfToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/admin/bootstrap:
    post:
      tags: [Admin]
      operationId: bootstrapFirstAdmin
      summary: Provision the first Admin exactly once
      description: Requires the currently signed-in pending Manus identity, the protected bootstrap header, a CSRF token and an unused durable bootstrap-state row.
      security: [{ appSession: [], csrfToken: [], adminBootstrapToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/admin/summary:
    get:
      tags: [Admin]
      operationId: adminSummary
      summary: Admin totals and operational counts
      security: [{ appSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List provisionable accounts
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, active, disabled] } }
      security: [{ appSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/admin/users/{user_id}:
    patch:
      tags: [Admin]
      operationId: updateUserRole
      summary: Update an existing provisioned account's role/status
      description: Admin elevation cannot be assigned here; Student/Staff roles require a corresponding profile first. The last active Admin is protected.
      parameters:
        - { in: path, name: user_id, required: true, schema: { type: string, format: uuid } }
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [Student, Staff, Admin] }
                status: { type: string, enum: [active, disabled, pending], default: active }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/admin/departments:
    get:
      tags: [Admin]
      operationId: listDepartments
      summary: List departments
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Admin]
      operationId: createDepartment
      summary: Create department
      security: [{ appSession: [], csrfToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /api/admin/classrooms:
    get:
      tags: [Admin]
      operationId: listClassrooms
      summary: List classrooms
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Admin]
      operationId: createClassroom
      summary: Create classroom
      security: [{ appSession: [], csrfToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassroomCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /api/admin/sections:
    get:
      tags: [Admin]
      operationId: listSections
      summary: List class sections
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Admin]
      operationId: createSection
      summary: Create a year/term class section
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_id, code, academic_year, term]
              properties:
                department_id: { type: string, format: uuid }
                classroom_id: { type: [string, 'null'], format: uuid }
                code: { type: string, maxLength: 32 }
                academic_year: { type: integer, minimum: 1, maximum: 12 }
                term: { type: string, maxLength: 32 }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /api/admin/subjects:
    post:
      tags: [Subjects]
      operationId: createSubject
      summary: Create a department subject
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_id, code, name]
              properties:
                department_id: { type: string, format: uuid }
                code: { type: string, maxLength: 32 }
                name: { type: string, maxLength: 160 }
                credits: { type: integer, default: 0, minimum: 0, maximum: 40 }
      responses: { '201': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /api/admin/students:
    post:
      tags: [Admin, Students]
      operationId: provisionStudent
      summary: Provision a Student profile for an OAuth-created account
      description: Department and year must match the selected class section; roll number and user profile are unique.
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, department_id, section_id, roll_number, academic_year]
              properties:
                user_id: { type: string, format: uuid }
                department_id: { type: string, format: uuid }
                section_id: { type: string, format: uuid }
                roll_number: { type: string, minLength: 1, maxLength: 48 }
                academic_year: { type: integer, minimum: 1, maximum: 12 }
      responses: { '201': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /api/admin/students/{student_id}:
    patch:
      tags: [Admin, Students]
      operationId: updateStudent
      summary: Update Student academic profile
      parameters: [{ in: path, name: student_id, required: true, schema: { type: string, format: uuid } }]
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                department_id: { type: [string, 'null'], format: uuid }
                section_id: { type: [string, 'null'], format: uuid }
                academic_year: { type: [integer, 'null'], minimum: 1, maximum: 12 }
                status: { type: [string, 'null'], enum: [active, inactive] }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/admin/staff:
    post:
      tags: [Admin, Staff]
      operationId: provisionStaff
      summary: Provision a Staff profile for an OAuth-created account
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, department_id, staff_number]
              properties:
                user_id: { type: string, format: uuid }
                department_id: { type: string, format: uuid }
                staff_number: { type: string, maxLength: 48 }
      responses: { '201': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /api/admin/staff-subject-assignments:
    post:
      tags: [Admin, Staff]
      operationId: createStaffSubjectAssignment
      summary: Assign Staff to a subject and class section
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staff_id, subject_id, section_id]
              properties:
                staff_id: { type: string, format: uuid }
                subject_id: { type: string, format: uuid }
                section_id: { type: string, format: uuid }
                valid_from: { type: [string, 'null'], format: date }
                valid_to: { type: [string, 'null'], format: date }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /api/admin/device-enrollment-tokens:
    post:
      tags: [Admin, Devices]
      operationId: createDeviceEnrollmentToken
      summary: Issue a one-use Pi enrollment token for a classroom
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classroom_id]
              properties:
                classroom_id: { type: string, format: uuid }
                expires_in_minutes: { type: integer, default: 10, minimum: 1, maximum: 60 }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /api/admin/devices:
    get:
      tags: [Admin, Devices]
      operationId: listDevices
      summary: List Pi devices, classroom mapping, online/offline and health status
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' } }
  /api/admin/devices/{device_uuid}/activate:
    post:
      tags: [Admin, Devices]
      operationId: activateDevice
      summary: Activate a pending Pi device after reviewing its classroom mapping
      parameters: [{ in: path, name: device_uuid, required: true, schema: { type: string, format: uuid } }]
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceActivationRequest' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/admin/devices/{device_uuid}:
    patch:
      tags: [Admin, Devices]
      operationId: updateDevice
      summary: Update a device's Admin-managed mapping/status
      parameters: [{ in: path, name: device_uuid, required: true, schema: { type: string, format: uuid } }]
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdateRequest' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/admin/devices/{device_uuid}/rotate-credential:
    post:
      tags: [Admin, Devices]
      operationId: rotateDeviceCredential
      summary: Revoke a prior Pi credential and return a replacement once
      parameters: [{ in: path, name: device_uuid, required: true, schema: { type: string, format: uuid } }]
      security: [{ appSession: [], csrfToken: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/admin/attendance-corrections:
    get:
      tags: [Admin, Attendance]
      operationId: listPendingCorrections
      summary: List pending attendance correction requests for review
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/admin/attendance-corrections/{correction_id}/review:
    post:
      tags: [Admin, Attendance]
      operationId: reviewAttendanceCorrection
      summary: Approve/reject a correction with review note and audit history
      parameters: [{ in: path, name: correction_id, required: true, schema: { type: string, format: uuid } }]
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                review_note: { type: [string, 'null'], maxLength: 500 }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /api/admin/audit:
    get:
      tags: [Admin]
      operationId: listAuditEvents
      summary: Read recent privileged and business audit events
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/students:
    get:
      tags: [Students]
      operationId: listStudents
      summary: List only records visible to the current role/assignment scope
      description: A Student receives only their own profile; Staff sees assigned sections; Admin sees institution scope.
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: department_id, schema: { type: string, format: uuid } }
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
  /api/students/me:
    get:
      tags: [Students]
      operationId: currentStudent
      summary: Fetch the current Student's own profile
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/students/me/attendance-summary:
    get:
      tags: [Students, Attendance]
      operationId: currentStudentAttendanceSummary
      summary: Return the current Student's per-subject and overall attendance totals
      description: Counts past non-cancelled sessions in the student's own section and includes only that student's own attendance records; an unrecorded session contributes to the denominator but not attendance.
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/students/{student_id}:
    get:
      tags: [Students]
      operationId: getStudent
      summary: Fetch one Student within the current server-authorized scope
      parameters: [{ in: path, name: student_id, required: true, schema: { type: string, format: uuid } }]
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/staff:
    get:
      tags: [Staff]
      operationId: listStaff
      summary: List Staff within the current role scope
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/staff/me/assignments:
    get:
      tags: [Staff]
      operationId: currentStaffAssignments
      summary: List the current Staff member's active subject/class assignments
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/subjects:
    get:
      tags: [Subjects]
      operationId: listSubjects
      summary: List subjects within the current user/class assignment scope
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/attendance:
    get:
      tags: [Attendance]
      operationId: listAttendance
      summary: Query attendance rows within the current student/class scope
      parameters:
        - { in: query, name: student_id, schema: { type: string, format: uuid } }
        - { in: query, name: subject_id, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [Present, Absent, Late] } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Attendance]
      operationId: markAttendance
      summary: Staff/Admin mark Present, Absent or Late for an eligible assigned session
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, student_id, status]
              properties:
                session_id: { type: string, format: uuid }
                student_id: { type: string, format: uuid }
                status: { type: string, enum: [Present, Absent, Late] }
                reason: { type: [string, 'null'], maxLength: 500 }
      responses: { '201': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /api/attendance/sessions:
    get:
      tags: [Attendance]
      operationId: listSessions
      summary: List class sessions within the current role scope
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Attendance]
      operationId: createSession
      summary: Create a time-zoned session for an Admin or assigned Staff member
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id, section_id, starts_at, ends_at]
              properties:
                subject_id: { type: string, format: uuid }
                section_id: { type: string, format: uuid }
                staff_id: { type: [string, 'null'], format: uuid }
                classroom_id: { type: [string, 'null'], format: uuid }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                status: { type: string, enum: [scheduled, open, closed, cancelled], default: scheduled }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /api/attendance/{record_id}/corrections:
    post:
      tags: [Attendance]
      operationId: requestAttendanceCorrection
      summary: Staff submit a reasoned correction request for an assigned session
      parameters: [{ in: path, name: record_id, required: true, schema: { type: string, format: uuid } }]
      security: [{ appSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_status, reason]
              properties:
                requested_status: { type: string, enum: [Present, Absent, Late] }
                reason: { type: string, minLength: 8, maxLength: 500 }
      responses: { '201': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /api/device/register:
    post:
      tags: [Devices]
      operationId: registerDevice
      summary: Redeem one Admin-issued classroom enrollment token and receive a credential once
      security: [{ deviceEnrollmentToken: [] }]
      description: HTTPS required. New devices are `pending` until explicitly activated by an Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegisterRequest' }
      responses: { '201': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /api/device/heartbeat:
    post:
      tags: [Devices]
      operationId: deviceHeartbeat
      summary: Submit an authenticated device health heartbeat
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceHeartbeatRequest' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '426': { $ref: '#/components/responses/Error' } }
  /api/device/attendance:
    post:
      tags: [Devices]
      operationId: deviceAttendance
      summary: Submit an idempotent device attendance event
      description: HTTPS and an active per-device bearer credential are required; the server checks student-section, class session, classroom mapping and duplicates.
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceAttendanceRequest' }
      responses: { '201': { $ref: '#/components/responses/Success' }, '200': { $ref: '#/components/responses/Success' }, '422': { $ref: '#/components/responses/Error' }, '426': { $ref: '#/components/responses/Error' } }
  /api/device/status:
    get:
      tags: [Devices]
      operationId: deviceStatus
      summary: Fetch the authenticated Pi's status and heartbeat age
      security: [{ deviceBearer: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '426': { $ref: '#/components/responses/Error' } }
  /api/predictions:
    get:
      tags: [Predictions]
      operationId: listPredictions
      summary: List persisted predictions within the current role scope
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/predictions/me:
    get:
      tags: [Predictions]
      operationId: myPredictions
      summary: List only the current Student's persisted forecasts
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/predictions/models:
    get:
      tags: [Predictions]
      operationId: listPredictionModels
      summary: List trained candidate/active model versions and chronological metrics
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/predictions/train:
    post:
      tags: [Predictions]
      operationId: trainCandidateModel
      summary: Admin-only training of a reviewable chronological candidate
      security: [{ appSession: [], csrfToken: [] }]
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /api/predictions/generate:
    post:
      tags: [Predictions]
      operationId: generatePersistedPredictions
      summary: Admin-only generation using the active model and actual attendance history
      security: [{ appSession: [], csrfToken: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /api/predictions/models/{model_version}/activate:
    post:
      tags: [Predictions]
      operationId: activatePredictionModel
      summary: Admin-only activation of a reviewable model candidate
      parameters: [{ in: path, name: model_version, required: true, schema: { type: string } }]
      security: [{ appSession: [], csrfToken: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List notifications for the current user only
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/notifications/{notification_id}/read:
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one current-user notification as read
      parameters: [{ in: path, name: notification_id, required: true, schema: { type: string, format: uuid } }]
      security: [{ appSession: [], csrfToken: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /api/reports/summary:
    get:
      tags: [Reports]
      operationId: reportSummary
      summary: Actual attendance aggregates in Admin or assigned Staff scope
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/reports/low-attendance:
    get:
      tags: [Reports]
      operationId: lowAttendance
      summary: List actual low-attendance risk records in the current report scope
      parameters: [{ in: query, name: threshold, schema: { type: number, minimum: 0, maximum: 100, default: 75 } }]
      security: [{ appSession: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/reports/attendance.csv:
    get:
      tags: [Reports]
      operationId: downloadAttendanceCsv
      summary: Download an auditable role-scoped CSV report
      security: [{ appSession: [] }]
      responses:
        '200': { description: CSV export from actual database rows, content: { text/csv: { schema: { type: string, format: binary } } } }
  /api/reports/attendance.pdf:
    get:
      tags: [Reports]
      operationId: downloadAttendancePdf
      summary: Download a role-scoped PDF attendance report
      security: [{ appSession: [] }]
      responses:
        '200': { description: PDF export from actual database rows, content: { application/pdf: { schema: { type: string, format: binary } } } }
components:
  securitySchemes:
    appSession:
      type: apiKey
      in: cookie
      name: webdev_app_session
      description: Eight-hour application session JWT; on HTTPS set with SameSite=None; Secure; HttpOnly.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Must match the `smartattend_csrf` cookie for authenticated writes.
    adminBootstrapToken:
      type: apiKey
      in: header
      name: X-Admin-Bootstrap-Token
      description: Protected project secret, accepted only for the single first-Admin bootstrap.
    deviceEnrollmentToken:
      type: apiKey
      in: header
      name: X-Device-Enrollment-Token
      description: One-use, expiring Admin-generated enrollment token; never a permanent device credential.
    deviceBearer:
      type: http
      scheme: bearer
      description: Unique active Pi credential, returned once at registration and stored server-side as a verifier.
  responses:
    Success:
      description: Successful JSON response envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Error:
      description: Structured JSON error envelope with stable code and request ID.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data: {}
        request_id: { type: [string, 'null'], format: uuid }
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
        request_id: { type: [string, 'null'], format: uuid }
    OAuthStartRequest:
      type: object
      required: [origin]
      properties:
        origin: { type: string, format: uri, description: Must match the verified browser origin. }
    LivenessResponse:
      type: object
      required: [status, service, request_id]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: smartattend-api }
        request_id: { type: [string, 'null'], format: uuid }
    DepartmentCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 24 }
        name: { type: string, minLength: 2, maxLength: 120 }
    ClassroomCreate:
      type: object
      required: [building, room_code]
      properties:
        building: { type: string, minLength: 1, maxLength: 100 }
        room_code: { type: string, minLength: 1, maxLength: 32 }
        description: { type: [string, 'null'], maxLength: 200 }
    DeviceRegisterRequest:
      type: object
      required: [device_id]
      additionalProperties: false
      properties:
        device_id: { type: string, pattern: '^[A-Za-z0-9._-]{3,80}$' }
        firmware_version: { type: [string, 'null'], maxLength: 48 }
    DeviceActivationRequest:
      type: object
      additionalProperties: false
      properties:
        classroom_id: { type: [string, 'null'], format: uuid }
    DeviceUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        classroom_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [active, revoked, pending] }
    DeviceHeartbeatRequest:
      type: object
      required: [event_id, timestamp]
      additionalProperties: false
      properties:
        event_id: { type: string, minLength: 8, maxLength: 120 }
        timestamp: { type: string, format: date-time, description: Must include a timezone offset. }
        firmware_version: { type: [string, 'null'], maxLength: 48 }
        health:
          type: object
          maxProperties: 24
          additionalProperties: true
          description: Server stores only allow-listed numeric health metrics.
    DeviceAttendanceRequest:
      type: object
      required: [event_id, idempotency_key, timestamp, session_id, roll_number]
      additionalProperties: false
      properties:
        event_id: { type: string, minLength: 8, maxLength: 120 }
        idempotency_key: { type: string, minLength: 8, maxLength: 120 }
        timestamp: { type: string, format: date-time, description: Must include a timezone offset. }
        session_id: { type: string, format: uuid }
        roll_number: { type: string, minLength: 1, maxLength: 48 }
        status: { type: string, enum: [Present, Absent, Late], default: Present }
        sensor_type: { type: string, enum: [unspecified, rfid, qr, fingerprint, camera, other], default: unspecified }
        sensor_reference: { type: [string, 'null'], maxLength: 120 }
